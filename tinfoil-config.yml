cvm-version: 0.14.15@sha256:51166e30f9292cbddf28d493cac6f12d42a9b8aa75bb9a1b5cf759f02f8b7bf4
cpus: 2
memory: 8192
networks:
  internet:
    egress: open
containers:
- name: darcy
  image: ghcr.io/justinmoon/darcy-tee-demo@sha256:3c60b36ab4d2e11cdaf29720ad1e0735152bafbcfd59999c15bdabc8db6f237f
  user: 1000:1000
  read_only: true
  networks:
  - internet
  pids_limit: 256
  restart: on-failure
  env:
  - DARCY_OWNER_PUBLIC_KEY: 1cccf12d9fad73b10e11803a4e6ef06ca1bb4b9dd373e4b140daab2efc6b18be
  tmpfs:
    /tmp: size=128m,mode=1777
    /workspace: size=1g,uid=1000,gid=1000
