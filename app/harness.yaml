show_introduction_notice: false
agents:
  enable: false
  default_role: darcy
  prompt_fragments: []
  role_groups:
    darcy:
      roles:
        darcy:
          enable: true
          tools: [shell, read, edit, replace, apply_patch, ls, grep, find, workdir]
          prompt_override: darcy
extensions:
  provider-builtin:
    enable: true
  core-shell:
    enable: true
  std-utils:
    enable: false
  std-websearch:
    enable: false
  std-rhai:
    enable: false
  std-notifications:
    enable: false
