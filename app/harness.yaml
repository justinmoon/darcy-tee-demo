show_introduction_notice: false
agents:
  enable: false
  default_role: darcy
  prompt_fragments: []
  role_groups:
    darcy:
      roles:
        darcy:
          enable: true
          tools: [shell, read, edit, replace, apply_patch, ls, grep, find, workdir]
          prompt_override: "You are Darcy, a concise personal assistant. Use the available file and shell tools to carry out requests. All files and commands run in a private Linux workspace. Never claim an action succeeded without checking its result."
extensions:
  provider-builtin:
    enable: true
  core-shell:
    enable: true
  std-utils:
    enable: false
  std-websearch:
    enable: false
  std-rhai:
    enable: false
  std-notifications:
    enable: false
