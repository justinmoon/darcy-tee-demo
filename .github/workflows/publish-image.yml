name: Publish prebuilt Nix image
on:
  workflow_dispatch:
    inputs:
      asset_tag:
        description: Release holding image.tar.gz built from this source
        required: true
        type: string
      archive_sha256:
        description: SHA256 of the locally tested image archive
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Load and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSET_TAG: ${{ inputs.asset_tag }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          gh release download "$ASSET_TAG" --pattern image.tar.gz
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  image.tar.gz\n' "$ARCHIVE_SHA256" | sha256sum -c -
          docker load -i image.tar.gz
          docker image inspect "ghcr.io/$GH_REPO:dev" --format '{{.Id}}'
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/$GH_REPO:dev"
